name: publish
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  # write: the last step commits the site to the catalog-site branch.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch OpenSlate at pinned ref
        run: |
          set -euo pipefail
          ref=$(cat .openslate-version)
          git clone --quiet https://github.com/cinderblock/openslate.git .openslate
          git -C .openslate checkout --quiet "$ref"

      - name: Install OpenSlate deps
        working-directory: .openslate
        run: bun install --frozen-lockfile

      - name: Stage signing key from secret
        env:
          OPENSLATE_SIGNING_KEY: ${{ secrets.OPENSLATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENSLATE_SIGNING_KEY:-}" ]; then
            echo "::error::OPENSLATE_SIGNING_KEY secret is not set on this repo."
            echo "Add the full project signing identity JSON as a repository secret named OPENSLATE_SIGNING_KEY."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          chmod 700 "$RUNNER_TEMP/signing"
          printf '%s' "$OPENSLATE_SIGNING_KEY" > "$RUNNER_TEMP/signing/key.json"
          chmod 600 "$RUNNER_TEMP/signing/key.json"
          echo "SIGNING_KEY_PATH=$RUNNER_TEMP/signing/key.json" >> "$GITHUB_ENV"

      - name: Test the scripts
        run: bun run test

      - name: Schema- and ballot-check every positions.json
        run: bun scripts/verify-positions.ts

      - name: Sign every slate
        run: bun .openslate/packages/cli/src/index.ts sign --batch . --key "$SIGNING_KEY_PATH" --force

      # Signing stamps a fresh issued_at on every slate. Put back the published token of
      # each slate that hasn't changed, so the app only re-downloads ones that did.
      - name: Keep unchanged slates' published tokens
        run: bun scripts/keep-unchanged.ts

      - name: Verify signed slates round-trip against project public key
        run: bun scripts/verify-signed.ts

      - name: Build static site
        run: bun scripts/build-site.ts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # The same site, for https://catalog.openslate.us. Cloudflare Workers Builds
      # deploys the catalog-site branch, so no Cloudflare credential lives here.
      # Each run adds a commit (never a force-push) whose tree is
      # catalog-site/wrangler.jsonc and README.md at the root, and dist/ plus
      # catalog-site/_headers under site/. Skipped when nothing changed.
      - name: Commit the site to the catalog-site branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/catalog-site"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp catalog-site/wrangler.jsonc catalog-site/README.md "$stage/"
          cp -R dist "$stage/site"
          cp catalog-site/_headers "$stage/site/_headers"

          index="$RUNNER_TEMP/catalog-site.index"
          rm -f "$index"
          GIT_INDEX_FILE="$index" git --work-tree="$stage" add --all --force -- "$stage"
          tree=$(GIT_INDEX_FILE="$index" git write-tree)

          message="Site from ${GITHUB_SHA::7}"
          if git ls-remote --exit-code --heads origin catalog-site >/dev/null; then
            git fetch --quiet --depth=1 origin catalog-site
            parent=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "catalog-site already has this site."
              exit 0
            fi
            commit=$(git commit-tree "$tree" -p "$parent" -m "$message")
          else
            commit=$(git commit-tree "$tree" -m "$message")
          fi
          git push origin "$commit:refs/heads/catalog-site"
