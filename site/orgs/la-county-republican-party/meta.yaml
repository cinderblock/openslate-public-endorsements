about: |
  The Republican Party of Los Angeles County (LAGOP), the county central
  committee of the California Republican Party for Los Angeles County.
  For the November 2026 general election it publishes an address-based
  "LAGOP Endorsement Lookup" voter guide, linked from its home page, with
  LAGOP endorsements, CAGOP statewide endorsements, "Recommended" picks in
  races without a formal endorsement, and Yes/No positions on every state
  proposition and judicial retention.
