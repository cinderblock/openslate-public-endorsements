about: |
  Santa Cruz County Democratic Party (Santa Cruz County Democratic Central
  Committee, SCCDCC). Members vote on endorsements at forums with a 60%
  threshold. Its endorsements page shows "2026 Local Endorsements" as image
  cards and local measure positions, followed by a reposted copy of the
  California Democratic Party's endorsements.
