about: |
  State affiliate of the League of Women Voters. Takes positions on
  qualified California statewide ballot measures (and sometimes co-sponsors
  them via the legislature). Like the national LWV, does NOT endorse
  candidates and does not take positions on candidate races, so primary
  ballots dominated by candidate races typically have no LWV-CA
  recommendations.
