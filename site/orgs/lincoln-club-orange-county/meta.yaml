about: |
  The Lincoln Club of Orange County is a conservative, Republican-aligned
  donor and political organization founded in 1962. It publishes a voter
  guide with endorsed candidates and ballot-measure recommendations,
  covering Orange County races plus selected congressional, legislative and
  statewide contests.
