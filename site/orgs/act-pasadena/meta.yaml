about: |
  ACT is a Pasadena-area progressive political action group. Its partner,
  the Pasadena Arroyo Democratic Club (PADC), is chartered by the Los Angeles
  County Democratic Party and describes itself as the area's largest
  Democratic club (300+ members). The two share a Steering Committee and
  publish a joint endorsement list; endorsements are voted on by members.
