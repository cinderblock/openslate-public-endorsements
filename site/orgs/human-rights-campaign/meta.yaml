about: |
  Political action committee of the Human Rights Campaign, the national
  LGBTQ+ civil rights organization. HRC PAC endorses pro-equality
  candidates for federal, state and local office across the country. This
  bundle holds only its California picks for the November 3, 2026 general
  election; its endorsements in other states are not included.
