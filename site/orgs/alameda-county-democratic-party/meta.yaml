about: |
  The Alameda County Democratic Party (Alameda County Democratic Central
  Committee), the official county committee of the California Democratic
  Party. Publishes an endorsement slate for every election covering state,
  federal, city, school, special-district and ballot-measure contests in
  Alameda County.
