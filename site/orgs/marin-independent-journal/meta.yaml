about: |
  Daily newspaper serving Marin County (part of the Bay Area News Group /
  MediaNews Group). Its editorial board publishes endorsements in
  congressional, legislative and Marin local races and on Marin measures;
  statewide races and propositions are covered by Bay Area News Group
  editorials that the IJ republishes.
