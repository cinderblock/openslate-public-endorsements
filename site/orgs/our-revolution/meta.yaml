  National progressive 501(c)(4) founded after Bernie Sanders's 2016
  presidential campaign. It endorses candidates from city councils to
  Congress who sign its "Fight Oligarchy Pledge". This bundle holds only
  its California picks for the November 3, 2026 general election; its
  endorsements in other states are not included.
