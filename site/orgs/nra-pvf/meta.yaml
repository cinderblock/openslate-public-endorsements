about: |
  The National Rifle Association's political action committee (NRA-PVF).
  It grades candidates on Second Amendment issues and marks some of them
  as "NRA Endorsed". The NRA is national; this bundle holds only its
  California endorsements for the November 3, 2026 general election.
  Bare letter grades are not recorded, only explicit endorsements.
