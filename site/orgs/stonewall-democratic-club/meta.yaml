about: |
  Los Angeles-based LGBTQ+ Democratic club, chartered in 1975. Members vote
  on endorsements at general membership meetings. The club publishes its
  endorsed candidates for federal, state, Los Angeles County and city, and
  other Southern California municipal and school races, along with its
  ballot-measure positions.
