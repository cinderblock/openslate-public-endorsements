about: |
  Labor union representing professional fire fighters and emergency
  medical workers in the United States and Canada. Its federal PAC, IAFF
  FIREPAC, endorses candidates for Congress. The IAFF does not publish a
  California list itself; its California picks are published by its state
  affiliate, California Professional Firefighters. This bundle holds only
  its California picks for the November 3, 2026 general election.
