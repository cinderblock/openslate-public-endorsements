about: |
  Silicon Valley chapter of the Democratic Socialists of America (Santa
  Clara County and neighboring cities). Its Electoral Working Group writes a
  voter guide of recommendations, approved by a majority of the chapter;
  endorsements take a 75% chapter vote and commit chapter resources.
