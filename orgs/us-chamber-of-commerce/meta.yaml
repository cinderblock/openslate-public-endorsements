about: |
  National business federation that endorses candidates for federal office
  "who will support policies that drive innovation, grow the economy, and
  create opportunities for American businesses and workers," announcing each
  endorsement in a separate press release. This bundle holds only its
  California picks for the November 3, 2026 general election; endorsements
  in other states are not included.
