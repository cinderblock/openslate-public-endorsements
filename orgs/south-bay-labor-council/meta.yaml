about: |
  Central labor council of the AFL-CIO for Santa Clara and San Benito
  counties, representing affiliated union locals. Its Committee on Political
  Education (COPE) publishes endorsements in federal, state, and local races
  and on ballot measures, marking each local pick as a sole or dual
  endorsement.
