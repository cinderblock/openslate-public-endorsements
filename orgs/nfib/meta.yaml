about: |
  National small-business association. Its California state PAC (NFIB CA
  PAC) endorses candidates for the California Legislature and takes
  positions on state ballot measures; NFIB FedPAC endorses congressional
  candidates. This bundle holds only its California picks for the
  November 3, 2026 general election.
