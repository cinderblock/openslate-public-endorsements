name: Los Angeles County Federation of Labor, AFL-CIO
slug: la-county-federation-of-labor
uri: https://thelafed.org/
kind: organization
about: |
  Central labor council ("the LA Fed") representing AFL-CIO affiliated
  unions across Los Angeles County. Its Committee on Political Education
  (COPE) publishes an official voter guide each cycle. The guide covers
  statewide offices and propositions, Congress, the Legislature, LA County
  and LA City races and measures, and many smaller city, school, college,
  and water district contests. The guide is published as images, so
  bundles for this org are transcribed.
