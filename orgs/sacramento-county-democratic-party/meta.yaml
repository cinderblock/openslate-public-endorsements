about: |
  Sacramento County Democratic Central Committee ("SacDems"), the official
  Democratic Party affiliate for Sacramento County. Publishes a single
  endorsements page covering federal, state, county, city, school, special
  district, proposition and local measure contests on the Sacramento County
  ballot.
