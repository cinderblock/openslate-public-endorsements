about: |
  Planned Parenthood Affiliates of California (PPAC), the statewide public
  policy and advocacy office of California's Planned Parenthood affiliates.
  Its PPAC VOTES PAC endorses state constitutional officers and takes
  positions on statewide ballot measures. Legislative and local
  endorsements are published by the regional affiliate action funds.
