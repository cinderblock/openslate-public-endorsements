name: Los Angeles Area Chamber of Commerce
slug: la-area-chamber-of-commerce
uri: https://lachamber.com/
kind: organization
about: |
  The region's oldest and largest business association. Its candidate
  endorsements are made by the L.A. Jobs PAC, a nonpartisan political action
  committee sponsored by the Chamber; the Chamber's 2026 Voter Guide pairs
  those PAC endorsements with the Chamber's positions on city and state
  ballot measures.
