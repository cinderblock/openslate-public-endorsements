name: Los Angeles County Democratic Party
slug: la-county-democratic-party
uri: https://www.lacdp.org/
kind: organization
about: |
  The Los Angeles County Democratic Party (LACDP), the official county
  committee of the California Democratic Party for Los Angeles County.
  Its Central Committee votes on endorsements for partisan and nonpartisan
  offices and ballot measures in the county, and publishes them on its
  "Endorsed Candidates" and "Ballot Measures" pages.
