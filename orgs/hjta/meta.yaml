about: |
  California taxpayer advocacy association founded by Howard Jarvis, the
  author of Proposition 13 (1978). Publishes a voting guide each election
  with recommendations on statewide propositions and local tax measures,
  plus candidate endorsements from its political action committee,
  HJTA-PAC.
