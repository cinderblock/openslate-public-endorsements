about: |
  Sacramento Metropolitan Chamber of Commerce ("Metro Chamber"), the
  regional business chamber for the Sacramento area. Its 2026 Comprehensive
  Voter Guide carries the Chamber's state proposition and local measure
  positions and the candidate endorsements of its political action
  committee, Metro PAC.
