about: |
  North Bay Labor Council, AFL-CIO, the central labor council for unions in
  Sonoma, Marin, Mendocino and Lake counties (Santa Rosa). Publishes a
  single endorsements page per election covering federal, state legislative
  and local candidates and local measures in its four counties.
