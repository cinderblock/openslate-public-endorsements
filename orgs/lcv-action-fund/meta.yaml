about: |
  Federal political arm of the League of Conservation Voters, the national
  environmental advocacy organization. LCV Action Fund endorses
  pro-environment candidates for the U.S. House and Senate only. This
  bundle holds only its California picks for the November 3, 2026 general
  election; its endorsements in other states are not included.
