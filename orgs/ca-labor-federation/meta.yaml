name: California Federation of Labor Unions, AFL-CIO
slug: ca-labor-federation
uri: https://calaborfed.org/
kind: organization
about: |
  Statewide AFL-CIO labor federation (formerly branded the California
  Labor Federation) representing roughly 1,300 affiliated unions. Its
  COPE (Committee on Political Education) convention endorses candidates
  for statewide office, the Legislature, and Congress, and takes positions
  on statewide ballot measures each cycle.
