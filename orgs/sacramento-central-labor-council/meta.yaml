about: |
  Sacramento Central Labor Council, AFL-CIO: the central labor council for
  Sacramento, Yolo, Placer, El Dorado, Amador and Nevada counties. Its
  local endorsements for Nov 3, 2026 are published through the California
  Labor Federation's "Search by Labor Council" endorsements tool.
