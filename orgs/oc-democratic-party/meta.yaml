name: Democratic Party of Orange County
slug: oc-democratic-party
uri: https://orangecountydemocrats.com/
kind: organization
about: |
  The Democratic Party of Orange County (DPOC) is the county central
  committee of the California Democratic Party for Orange County. It endorses
  Democrats in nonpartisan local and county races and takes positions on local
  ballot measures, and republishes the party's statewide, congressional and
  legislative endorsements.
