about: |
  National reproductive-rights advocacy organization (formerly NARAL
  Pro-Choice America). It endorses "reproductive freedom champions" for
  federal, statewide and state legislative office across the country. This
  bundle holds only its California picks for the November 3, 2026 general
  election; its endorsements in other states are not included.
