about: |
  Alameda County's election office. This bundle is a ballot source, not an
  endorsement: every local candidate and local measure on the county's ballot
  as a neutral position, so a voter's ballot shows the whole field. Built by
  scripts/alameda-rov-ballot.ts from Alameda's candidate list and the measure
  headings of its Voter Information Guide, saved under evidence/. Titles
  reuse the catalog's existing subjects where a bundle already names the
  contest. Federal and state offices come from the Secretary of State's
  bundle.
