about: |
  Orange County's election office. This bundle is a ballot source, not an
  endorsement: every qualified local candidate and local measure on the
  county's ballot as a neutral position, so a voter's ballot shows the whole
  field. Built by scripts/oc-rov-ballot.ts from OC's contests-qualified page,
  candidate filing log and measures page, saved under evidence/. Titles reuse
  the catalog's existing subjects where a bundle already names the contest.
  Federal and state offices come from the Secretary of State's bundle.
