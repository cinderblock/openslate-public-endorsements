about: |
  The Ventura County Republican Party ("Ventura GOP"), the county central
  committee of the California Republican Party for Ventura County. For the
  November 2026 general election it publishes an "Official Republican
  November 3, 2026 Voter Guide" of "Endorsed & Best Choice Candidates" and
  proposition/measure positions, as one flyer image per county
  supervisorial district.
