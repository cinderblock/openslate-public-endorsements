name: Santa Clara County Democratic Party
slug: santa-clara-county-democratic-party
uri: https://sccdp.org/
kind: organization
about: |
  The official Democratic Party organization for Santa Clara County (the
  Santa Clara County Democratic Central Committee, campaigning as the Santa
  Clara County United Democratic Campaign). Endorses in local city, school,
  and special-district races and on local measures; for state and federal
  races it points voters to the California Democratic Party's endorsements.
