  Stanislaus County Democratic Central Committee (SCDCC), the official
  Democratic Party affiliate for Stanislaus County (Modesto). Publishes a
  2026 endorsements page with federal, legislative and local picks,
  including explicit "Do Not Support" positions in some local races.
