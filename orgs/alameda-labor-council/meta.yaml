name: Alameda Labor Council, AFL-CIO
slug: alameda-labor-council
uri: https://alamedalabor.org/
kind: organization
about: |
  The central labor council for Alameda County, an umbrella body of AFL-CIO
  affiliated unions. Federal and statewide recommendations follow the
  California Labor Federation's convention process; local endorsements are
  made by the council itself. Publishes its slate as a public Google Doc
  linked from its homepage.
