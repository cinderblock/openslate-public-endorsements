about: |
  Americans for Prosperity Action (AFP Action), the national
  independent-expenditure political committee affiliated with Americans
  for Prosperity. It endorses candidates for U.S. Senate and House. The
  org is national; this bundle holds only its California picks for the
  November 3, 2026 general election.
