about: |
  Service Employees International Union Local 1021, representing public
  and non-profit workers across Northern California, including San
  Francisco city workers. Members endorse candidates and measures each
  election, with regional slates for San Francisco, the East Bay, the
  Peninsula, and other areas. This bundle covers the statewide and San
  Francisco picks.
