name: Orange County Labor Federation
slug: oc-labor-federation
uri: https://www.oclabor.org/
kind: organization
about: |
  The Orange County Labor Federation, AFL-CIO (OCLF) is the central labor
  council for Orange County unions. Its Committee on Political Education
  (COPE) makes endorsements in federal, state, county, city, school and
  special-district races.
