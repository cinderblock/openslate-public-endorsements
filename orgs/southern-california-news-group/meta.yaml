about: |
  The shared editorial board of the Southern California News Group
  (MediaNews Group), which "opines in newspapers across Los Angeles
  County, Orange County, Riverside County and San Bernardino": the Orange
  County Register, Los Angeles Daily News, Long Beach Press-Telegram,
  Pasadena Star-News, Press-Enterprise, The Sun, Inland Valley Daily
  Bulletin and others. The San Diego Union-Tribune has a separate board.
  Endorsements are published once and run across the group's papers.
