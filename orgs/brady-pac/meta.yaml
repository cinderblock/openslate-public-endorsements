about: |
  National gun-violence-prevention organization (Brady; its political arms
  are the Brady Campaign and Brady PAC). Endorses candidates for federal
  and state office across the country and publishes them at
  elections.bradyunited.org. This bundle holds only its California picks
  for the November 3, 2026 general election; its endorsements in other
  states are not included.
