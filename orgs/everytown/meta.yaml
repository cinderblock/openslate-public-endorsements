about: |
  National gun-safety organization (with its volunteer network Moms Demand
  Action). Everytown for Gun Safety Action Fund endorses candidates, and
  Moms Demand Action separately awards a non-endorsement "Gun Sense
  Candidate" distinction; both are published at gunsensevoter.org. This
  bundle holds only Everytown's California endorsements for the November 3,
  2026 general election; its picks in other states, and Gun Sense Candidate
  distinctions, are not included.
