about: |
  The editorial board of the Los Angeles Times ("Times Editorial"). In
  2024-25 the paper stopped its traditional slate of candidate and ballot
  endorsements and largely stopped publishing unsigned editorials. For the
  November 2026 general election it has published one ballot
  recommendation: No on Proposition 40.
