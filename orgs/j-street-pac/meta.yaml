about: |
  Political action committee of J Street, the national "pro-Israel,
  pro-peace, pro-democracy" advocacy organization. It endorses candidates
  for the U.S. House and Senate across the country. This bundle holds only
  its California picks for the November 3, 2026 general election; its
  endorsements in other states are not included.
