about: |
  Editorial board of The Sacramento Bee (McClatchy). Statewide proposition
  and statewide-office endorsements are written by McClatchy Media's
  combined California editorial board and run in The Sacramento Bee,
  Fresno Bee, Modesto Bee, Merced Sun-Star and San Luis Obispo Tribune;
  local Sacramento-area picks are by The Bee Editorial Board.
