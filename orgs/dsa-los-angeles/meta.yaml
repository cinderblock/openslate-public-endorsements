name: Democratic Socialists of America, Los Angeles
slug: dsa-los-angeles
uri: https://dsa-la.org/
kind: organization
about: |
  Los Angeles chapter of the Democratic Socialists of America (DSA-LA).
  Publishes a general-election voter guide (voterguide.dsa-la.org) with two
  tiers: "Endorsed" candidates, chosen by a membership vote and backed with
  chapter time and resources, and "Recommended" editorial picks. The guide
  also gives Yes/No positions on ballot measures and states "No
  recommendation" where it takes no side. Its statewide section reproduces
  California DSA's recommendations.
