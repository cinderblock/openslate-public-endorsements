name: Indivisible
slug: indivisible
uri: https://indivisible.org/
kind: organization
about: |
  National progressive grassroots network. Indivisible Action (its hybrid
  PAC) endorses federal and gubernatorial candidates, but only ones first
  endorsed by a local Indivisible group. This bundle holds only its
  national California picks for the November 3, 2026 general election.
  Endorsements by local Indivisible groups and in other states are not
  included.
