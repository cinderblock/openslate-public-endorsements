about: |
  The Ventura County Democratic Party, the county central committee of the
  California Democratic Party for Ventura County. Publishes a voter guide
  ("Endorsements") listing state and federal candidates (most of them
  California Democratic Party endorsements), its own local endorsements,
  and positions on state propositions and local measures.
