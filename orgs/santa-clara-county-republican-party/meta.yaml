name: Santa Clara County Republican Party
slug: santa-clara-county-republican-party
uri: https://svgop.com/
kind: organization
about: |
  The official Republican Party organization for Santa Clara County, branded
  as the Silicon Valley GOP (SVGOP). Publishes a general-election voter guide
  card listing endorsed candidates for state, federal, legislative, and some
  local races, plus Yes/No recommendations on state propositions and the
  regional transit measure.
