about: |
  Newport Beach runs its own Special Municipal Election on November 3, 2026,
  on a ballot separate from the Orange County Registrar's, for Measures P, Q
  and R. This bundle is a ballot source, not an endorsement: those three
  measures as neutral Yes / No positions, so the catalog knows they're on a
  ballot. The city's General Municipal Election (council districts 1, 3, 4
  and 6, Measure H) is on the county's ballot and in the Orange County
  Registrar's bundle. Transcribed by hand from the city's elections page,
  saved under evidence/. Titles reuse the catalog's existing subjects.
