about: |
  Newport Beach called a Special Municipal Election for November 3, 2026, on
  a ballot of its own, for Measures P, Q and R. On October 27 the city said
  it "will not take place on November 3, 2026", so this bundle no longer
  lists them. It's a ballot source, not an endorsement: it now lists the
  city's one measure on the Nov 3 ballot, Measure H, as neutral Yes / No
  positions under the Orange County Registrar's subject and choice ids (the
  registrar's bundle has the same race, and the city's council seats). It
  stays in the catalog so that a voter who imported the P, Q and R listing
  gets this one in its place. Transcribed by hand from the city's elections
  page, saved under evidence/.
