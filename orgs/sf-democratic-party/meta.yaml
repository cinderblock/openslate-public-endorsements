name: San Francisco Democratic Party (DCCC)
slug: sf-democratic-party
uri: https://www.sfdems.org/
kind: party
about: |
  San Francisco County Democratic Central Committee (SFDCCC), the
  official Democratic Party affiliate for San Francisco County.
  Endorsements cover SF-specific races, SF ballot measures, and
  pass-through ratification of relevant California Democratic Party
  endorsements affecting SF voters.
