name: Bay Area News Group editorial board (The Mercury News & East Bay Times)
slug: bay-area-news-group
uri: https://www.eastbaytimes.com/opinion/endorsements/
kind: organization
about: |
  Joint editorial board of Bay Area News Group's two flagship dailies, The
  Mercury News (San Jose) and the East Bay Times. The boards publish one shared
  endorsement list ("Mercury News & East Bay Times Editorial Boards") on both
  sites, and the same editorials run in other BANG papers such as the Marin
  Independent Journal.
