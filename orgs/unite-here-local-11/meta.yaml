name: UNITE HERE Local 11
slug: unite-here-local-11
uri: https://www.unitehere11.org/
kind: organization
about: |
  Hospitality workers' union representing over 32,000 workers in hotels,
  restaurants, airports, sports arenas, and convention centers throughout
  Southern California and Arizona. Publishes a membership-endorsed voter
  guide each cycle covering federal, statewide, legislative, judicial and
  proposition contests plus local races and measures in Los Angeles,
  Orange, Riverside and San Bernardino counties.
