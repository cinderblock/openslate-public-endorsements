about: |
  AFL-CIO central labor council for San Luis Obispo, Santa Barbara and
  Ventura counties, formerly the Tri-Counties Central Labor Council.
  Publishes local candidate and measure endorsements for the three
  counties; its statewide endorsements are set by the California Labor
  Federation.
