about: |
  Fresno County Democratic Central Committee (FCDCC), the official
  Democratic Party affiliate for Fresno County. Publishes its general
  election endorsements as two graphics: its own local picks and a
  pass-through of the California Democratic Party's state, federal and
  proposition endorsements.
