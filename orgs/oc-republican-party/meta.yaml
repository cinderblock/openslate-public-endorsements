name: Republican Party of Orange County
slug: oc-republican-party
uri: https://ocgop.org/
kind: organization
about: |
  The Republican Party of Orange County (OCGOP) is the county central
  committee of the California Republican Party for Orange County. It
  publishes an official Republican voter guide covering federal, statewide,
  legislative, county, city, school and water-district races, plus
  statewide propositions and some local measures.
