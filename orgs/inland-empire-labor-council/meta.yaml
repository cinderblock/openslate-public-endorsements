name: Inland Empire Labor Council, AFL-CIO
slug: inland-empire-labor-council
uri: https://ielabor.org/
kind: organization
about: |
  Central labor council of the AFL-CIO for Riverside and San Bernardino
  counties. Its Committee on Political Education (COPE) runs the
  endorsement process and publishes a union voter guide covering
  statewide, legislative and local races in both counties.
