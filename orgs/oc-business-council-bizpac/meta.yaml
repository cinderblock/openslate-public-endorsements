name: OCBC BIZPAC (Orange County Business Council)
slug: oc-business-council-bizpac
uri: https://ocbc.org/government-affairs/bizpac/
kind: organization
about: |
  BIZPAC is the political action committee sponsored by the Orange County
  Business Council (OCBC), governed by its own Board of Trustees, which
  "independently evaluates candidates and determines endorsements and
  political contributions" with a focus on Orange County's business
  community.
