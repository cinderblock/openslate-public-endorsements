about: |
  San Diego County's election office. This bundle is a ballot source, not an
  endorsement: every qualified local candidate and local measure on the
  county's ballot as a neutral position, so a voter's ballot shows the whole
  field. Built by scripts/sd-rov-ballot.ts from San Diego's Candidate List
  and the bookmarks of its Voter Information Pamphlets, saved under evidence/.
  Titles reuse the catalog's existing subjects where a bundle already names
  the contest. Federal and state offices come from the Secretary of State's
  bundle.
