about: |
  The San Bernardino County Democratic Party (San Bernardino County
  Democratic Central Committee, SBCDCC). Endorses candidates for local
  nonpartisan offices and takes positions on local ballot measures in San
  Bernardino County; for statewide races and propositions it points to
  the California Democratic Party's endorsements.
